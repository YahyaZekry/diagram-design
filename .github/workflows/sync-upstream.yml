name: Sync fork with upstream

# Keeps this fork current with cathrynlavery/diagram-design.
# Note: GitHub sometimes disables scheduled workflows in forks — if the
# schedule doesn't fire, enable Actions for the fork, or run this once from
# the Actions tab (workflow_dispatch).
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-fork
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream into fork
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/cathrynlavery/diagram-design.git
          git fetch --no-tags upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with upstream."
            exit 0
          fi

          git merge --no-edit upstream/main
          git push origin HEAD:main
