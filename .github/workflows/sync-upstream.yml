name: Sync fork with upstream

# Kept in the fork after each upstream merge. SYNC_PAT lives in the fork-sync
# environment and has workflow write access because upstream can change workflow files.
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: sync-fork
  cancel-in-progress: false

jobs:
  sync:
    environment: fork-sync
    runs-on: ubuntu-latest
    # Checkout only needs read access; the environment-scoped PAT performs the final push.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Merge upstream into fork
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/cathrynlavery/diagram-design.git
          git fetch --no-tags upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with upstream."
            exit 0
          fi

          git merge --no-edit upstream/main

          clean_remote="https://github.com/${GITHUB_REPOSITORY}.git"
          trap 'git remote set-url origin "$clean_remote"' EXIT
          git remote set-url origin \
            "https://x-access-token:${SYNC_PAT}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:main
        env:
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
